# Packet test of examples/ocpp, written from the OCPP-J 1.6 and OCPP 1.6
# specifications (not a port: the corpus has no OCPP model). Format and
# rules: tests/corpus/README.md
schema: 1
id: "ocpp/callresult-boot-notification"
model: "ocpp"
summary: "A CALLRESULT, the Central System's answer to BootNotification (an unmasked server frame)"
parent:
  kind: "stack"
  path:
    - "ethernet"
    - "ip"
    - "tcp"
  selector: "TCP, a WebSocket session whose opening handshake offers ocpp1.6 (any port)"
  source: "OCPP-J 1.6 section 3 (OCPP over WebSocket, subprotocol ocpp1.6) and RFC 6455 section 1.7 (over TCP)"
bytes:
  - "81 5c 5b 33 2c 22 31 39 32 32 33 32 30 31 22 2c"
  - "7b 22 73 74 61 74 75 73 22 3a 22 41 63 63 65 70"
  - "74 65 64 22 2c 22 63 75 72 72 65 6e 74 54 69 6d"
  - "65 22 3a 22 32 30 31 33 2d 30 32 2d 30 31 54 32"
  - "30 3a 35 33 3a 33 32 2e 34 38 36 5a 22 2c 22 69"
  - "6e 74 65 72 76 61 6c 22 3a 33 30 30 7d 5d"
bytes_source: "OCPP-J 1.6 section 4.2.2, the CALLRESULT syntax [3, \"<UniqueId>\", {<Payload>}], with the UniqueId of the section 4.2.1 example and a BootNotification.conf (OCPP 1.6 section 6.4: status, currentTime, interval), compact JSON, in one unmasked text frame (RFC 6455 section 5.2: a server's frames are not masked, section 5.1)"
expect:
  protocol: "OCPP_EXAMPLE"
  proto_id: 993
  next:
    kind: "none"
    source: "model-declared: encapsulation is false, so no next protocol"
  attributes:
    - name: "message_type_id"
      type: "MMT_U8_DATA"
      offset: 3
      length: 1
      value: 3
      source: "OCPP-J 1.6 section 4.1.3: MessageTypeId 3, a CALLRESULT (a response), the first element of the array"
    - name: "unique_id"
      type: "MMT_STRING_DATA"
      offset: 6
      length: 8
      value: "31 39 32 32 33 32 30 31"
      text: "19223201"
      source: "OCPP-J 1.6 section 4.1.4 and 4.2: the UniqueId, the second element, as sent: the UniqueId of the CALL it answers"
    - name: "action"
      type: "MMT_STRING_DATA"
      status: "absent"
      source: "OCPP-J 1.6 section 4.2.2 and 4.2.3: an answer carries no Action; alone (no session), no CALL to link its UniqueId to (src/ocpp_example_impl.c)"
    - name: "error_code"
      type: "MMT_STRING_DATA"
      status: "absent"
      source: "OCPP-J 1.6 section 4.2.3: only a CALLERROR has an errorCode"
    - name: "error_description"
      type: "MMT_STRING_DATA"
      status: "absent"
      source: "OCPP-J 1.6 section 4.2.3: only a CALLERROR has an errorDescription"
    - name: "payload"
      type: "MMT_BINARY_VAR_DATA"
      offset: 16
      length: 77
      value: "7b 22 73 74 61 74 75 73 22 3a 22 41 63 63 65 70 74 65 64 22 2c 22 63 75 72 72 65 6e 74 54 69 6d 65 22 3a 22 32 30 31 33 2d 30 32 2d 30 31 54 32 30 3a 35 33 3a 33 32 2e 34 38 36 5a 22 2c 22 69 6e 74 65 72 76 61 6c 22 3a 33 30 30 7d"
      text: "{\"status\":\"Accepted\",\"currentTime\":\"2013-02-01T20:53:32.486Z\",\"interval\":300}"
      source: "OCPP-J 1.6 section 4.2.2: the Payload, the third element of a CALLRESULT, as sent"
    - name: "connector_id"
      type: "MMT_U32_DATA"
      status: "absent"
      source: "OCPP 1.6 section 6: the typed fields are read from a CALL's payload only"
    - name: "id_tag"
      type: "MMT_STRING_DATA"
      status: "absent"
      source: "OCPP 1.6 section 6: the typed fields are read from a CALL's payload only"
    - name: "message_count"
      type: "MMT_U32_DATA"
      offset: 0
      length: 94
      value: 1
      source: "OCPP-J 1.6 section 4.1.2 and RFC 6455 section 5.6: one message in the segment's one text frame"
