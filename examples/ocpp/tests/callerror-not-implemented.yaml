# Packet test of examples/ocpp, written from the OCPP-J 1.6 and OCPP 1.6
# specifications (not a port: the corpus has no OCPP model). Format and
# rules: tests/corpus/README.md
schema: 1
id: "ocpp/callerror-not-implemented"
model: "ocpp"
summary: "A CALLERROR, NotImplemented (an unmasked server frame)"
parent:
  kind: "stack"
  path:
    - "ethernet"
    - "ip"
    - "tcp"
  selector: "TCP, a WebSocket session whose opening handshake offers ocpp1.6 (any port)"
  source: "OCPP-J 1.6 section 3 (OCPP over WebSocket, subprotocol ocpp1.6) and RFC 6455 section 1.7 (over TCP)"
bytes:
  - "81 4e 5b 34 2c 22 31 39 32 32 33 32 30 32 22 2c"
  - "22 4e 6f 74 49 6d 70 6c 65 6d 65 6e 74 65 64 22"
  - "2c 22 52 65 71 75 65 73 74 65 64 20 41 63 74 69"
  - "6f 6e 20 69 73 20 6e 6f 74 20 6b 6e 6f 77 6e 20"
  - "62 79 20 72 65 63 65 69 76 65 72 22 2c 7b 7d 5d"
bytes_source: "OCPP-J 1.6 section 4.2.3, the CALLERROR syntax [4, \"<UniqueId>\", \"<errorCode>\", \"<errorDescription>\", {<errorDetails>}], with the error code NotImplemented and its description from the table of valid error codes, empty errorDetails, compact JSON, in one unmasked text frame (RFC 6455 section 5.2)"
expect:
  protocol: "OCPP_EXAMPLE"
  proto_id: 993
  next:
    kind: "none"
    source: "model-declared: encapsulation is false, so no next protocol"
  attributes:
    - name: "message_type_id"
      type: "MMT_U8_DATA"
      offset: 3
      length: 1
      value: 4
      source: "OCPP-J 1.6 section 4.1.3: MessageTypeId 4, a CALLERROR (an error response), the first element of the array"
    - name: "unique_id"
      type: "MMT_STRING_DATA"
      offset: 6
      length: 8
      value: "31 39 32 32 33 32 30 32"
      text: "19223202"
      source: "OCPP-J 1.6 section 4.1.4 and 4.2: the UniqueId, the second element, as sent: the UniqueId of the CALL it answers"
    - name: "action"
      type: "MMT_STRING_DATA"
      status: "absent"
      source: "OCPP-J 1.6 section 4.2.2 and 4.2.3: an answer carries no Action; alone (no session), no CALL to link its UniqueId to (src/ocpp_example_impl.c)"
    - name: "error_code"
      type: "MMT_STRING_DATA"
      offset: 17
      length: 14
      value: "4e 6f 74 49 6d 70 6c 65 6d 65 6e 74 65 64"
      text: "NotImplemented"
      source: "OCPP-J 1.6 section 4.2.3: the errorCode, the third element; NotImplemented is in the table of valid error codes"
    - name: "error_description"
      type: "MMT_STRING_DATA"
      offset: 34
      length: 41
      value: "52 65 71 75 65 73 74 65 64 20 41 63 74 69 6f 6e 20 69 73 20 6e 6f 74 20 6b 6e 6f 77 6e 20 62 79 20 72 65 63 65 69 76 65 72"
      text: "Requested Action is not known by receiver"
      source: "OCPP-J 1.6 section 4.2.3: the errorDescription, the fourth element (here the table's description of NotImplemented)"
    - name: "payload"
      type: "MMT_BINARY_VAR_DATA"
      offset: 77
      length: 2
      value: "7b 7d"
      text: "{}"
      source: "OCPP-J 1.6 section 4.2.3: the errorDetails, the fifth element, an empty object when there are none"
    - name: "connector_id"
      type: "MMT_U32_DATA"
      status: "absent"
      source: "OCPP 1.6 section 6: the typed fields are read from a CALL's payload only"
    - name: "message_count"
      type: "MMT_U32_DATA"
      offset: 0
      length: 80
      value: 1
      source: "OCPP-J 1.6 section 4.1.2 and RFC 6455 section 5.6: one message in the segment's one text frame"
