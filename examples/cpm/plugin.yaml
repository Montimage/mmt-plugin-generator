# Port of plugins/cpm_plugin (ETSI TS 103 324 CPM): the ItsPduHeader and
# the start of the message.
schema: 1
protocol:
  label: cpm_example
  id: 981
  context: false
  session: false
  encapsulation: false
  encoding: network
sdk:
  profile: "1.10.2"
parents:
  - protocol: udp
    classify:
      match:
        - {offset: 8, length: 2, value: 0x020e}   # protocolVersion 2, messageID cpm(14)
      offset: 8
attributes:
  - name: protocolVersion
    type: MMT_U8_DATA
    offset: 0
    length: sizeof(char)
  - name: messageID
    type: MMT_U8_DATA
    offset: 1
    length: sizeof(char)
  - name: stationID
    type: MMT_U32_DATA
    offset: 2
    length: sizeof(int)
  - name: generationTime
    type: MMT_U16_DATA
    offset: 6
    length: sizeof(short)
