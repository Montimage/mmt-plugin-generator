# Packet test of examples/websocket, written from RFC 6455 and RFC 7692
# (permessage-deflate, #107). Format and rules: tests/corpus/README.md
schema: 1
id: "websocket/deflate-shared-window"
model: "websocket"
summary: "Section 7.2.3.2's second message alone: it refers to the first, which the segment does not have"
parent:
  kind: "stack"
  path:
    - "ethernet"
    - "ip"
    - "tcp"
  selector: "TCP, after an HTTP Upgrade to websocket (any port)"
  source: "RFC 6455 section 1.7 (over TCP) and section 4 (the opening handshake)"
bytes:
  - "c1 05 f2 00 11 00 00"
bytes_source: "RFC 7692 section 7.2.3.2: 0xc1 0x05 0xf2 0x00 0x11 0x00 0x00"
expect:
  protocol: "WEBSOCKET_EXAMPLE"
  proto_id: 992
  next:
    kind: "none"
    source: "model-declared: encapsulation is false, so no next protocol"
  attributes:
    - name: "handshake"
      type: "MMT_U8_DATA"
      offset: 0
      length: 1
      value: 0
      source: "RFC 6455 section 5.2: the segment is frame data, not an HTTP message of section 4"
    - name: "fin"
      type: "MMT_U8_DATA"
      offset: 0
      length: 1
      value: 1
      source: "RFC 6455 section 5.2: FIN, the most significant bit of byte 0"
    - name: "rsv1"
      type: "MMT_U8_DATA"
      offset: 0
      length: 1
      value: 1
      source: "RFC 7692 section 6: RSV1 set on a compressed message's first frame"
    - name: "opcode"
      type: "MMT_U8_DATA"
      offset: 0
      length: 1
      value: 1
      source: "RFC 6455 section 5.2: opcode, the low 4 bits of byte 0 (1: text)"
    - name: "mask"
      type: "MMT_U8_DATA"
      offset: 1
      length: 1
      value: 0
      source: "RFC 6455 section 5.2: MASK, the most significant bit of byte 1"
    - name: "payload_len"
      type: "MMT_U64_DATA"
      offset: 1
      length: 1
      value: 5
      source: "RFC 6455 section 5.2: Payload length, the low 7 bits of byte 1: the compressed bytes"
    - name: "payload_offset"
      type: "MMT_U32_DATA"
      offset: 0
      length: 2
      value: 2
      source: "RFC 6455 section 5.2: the payload follows the 2-byte header and the masking key"
    - name: "payload"
      type: "MMT_BINARY_VAR_DATA"
      offset: 2
      length: 5
      value: "f2 00 11 00 00"
      source: "RFC 6455 section 5.2: the payload as sent, not inflated (its back-reference needs the earlier message, RFC 7692 section 7.2.3.2)"
    - name: "payload_inflated"
      type: "MMT_U8_DATA"
      offset: 2
      length: 5
      value: 2
      source: "examples/README.md, WebSocket: 2, payload is compressed bytes not inflated (a distance past the history the window holds, RFC 1951 section 3.2)"
    - name: "frame_count"
      type: "MMT_U32_DATA"
      offset: 0
      length: 7
      value: 1
      source: "RFC 6455 section 5.2: one frame whose header ends in the segment"
    - name: "message_opcode"
      type: "MMT_U8_DATA"
      offset: 0
      length: 1
      value: 1
      source: "RFC 6455 section 5.4: a data frame's own opcode is its message's"
