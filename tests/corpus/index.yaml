# Test corpus index: constructs -> packets, and models -> packets.
# Format and rules: tests/corpus/README.md. Check with: python3 tests/corpus/validate.py
# covered_by is derived from each packet's constructs list; the validator checks they agree.
schema: 1
inventory: "Java generator behaviour inventory, Montimage/mmt-plugin-generator#3 first comment, section 1 (PDL language features)"
constructs:
  - id: "lexical.keyword_names"
    inventory: "section 1, Top level"
    summary: "a field named after a PDL keyword (id, len, offset, val, sizeof, label, session, packet, int, char, AND, OR); the Java lexer rejects it"
    covered_by:
      - "ip/fragment-mf"
      - "ip/udp-df"
      - "pdl_keyword_names/fields"
  - id: "define.decimal"
    inventory: "section 1, define"
    summary: "define NAME = <decimal>"
    covered_by:
      - "ethernet/arp"
      - "ethernet/ipv4"
      - "ethernet/ipv6"
      - "ethernet/lldp"
      - "ethernet/rarp"
      - "pdl_defines/kind-decimal-define"
  - id: "define.hex"
    inventory: "section 1, define"
    summary: "define NAME = 0x.."
    covered_by:
      - "ethernet/arp"
      - "ethernet/ipv4"
      - "ethernet/ipv6"
      - "ethernet/lldp"
      - "ethernet/rarp"
      - "pdl_defines/kind-hex-define"
  - id: "define.alias"
    inventory: "section 1, define"
    summary: "define NAME = OTHER_NAME"
    covered_by:
      - "pdl_defines/kind-alias-define"
  - id: "properties.label"
    inventory: "section 1, Properties"
    summary: "label: protocol name, upper-cased for PROTO_X_ALIAS"
    covered_by:
      - "abb/frame"
      - "mongodb/op-msg-ping"
      - "pdl_defines/kind-decimal-define"
      - "pdl_properties_all/basic"
  - id: "properties.id"
    inventory: "section 1, Properties"
    summary: "id: protocol id"
    covered_by:
      - "abb/frame"
      - "mongodb/op-msg-ping"
      - "pdl_defines/kind-decimal-define"
      - "pdl_properties_all/basic"
  - id: "properties.context"
    inventory: "section 1, Properties"
    summary: "context = \"true\""
    covered_by:
      - "ip/fragment-mf"
      - "ip/udp-df"
      - "pdl_properties_all/basic"
  - id: "properties.session_context"
    inventory: "section 1, Properties"
    summary: "session_context = \"true\""
    covered_by:
      - "dns/nxdomain-ad-cd"
      - "dns/query-a"
      - "dns/response-a"
      - "pdl_properties_all/basic"
  - id: "properties.session"
    inventory: "section 1, Properties"
    summary: "session = \"true\""
    covered_by:
      - "ip/fragment-mf"
      - "ip/udp-df"
      - "ndn/data"
      - "ndn/interest"
      - "pdl_properties_all/basic"
      - "pdl_scopes/single-packet-session"
  - id: "properties.encapsulation"
    inventory: "section 1, Properties"
    summary: "encapsulation = \"true\""
    covered_by:
      - "ethernet/arp"
      - "ethernet/ipv4"
      - "ethernet/ipv6"
      - "ethernet/lldp"
      - "ethernet/rarp"
      - "ip/fragment-mf"
      - "ip/udp-df"
      - "pdl_defines/kind-decimal-define"
      - "pdl_properties_all/basic"
  - id: "properties.optional_omitted"
    inventory: "section 1, Properties"
    summary: "only label and id: the optional keys default to false"
    covered_by:
      - "pdl_properties_minimal/basic"
  - id: "properties.encoding.network"
    inventory: "section 1, Properties"
    summary: "encoding = \"network\": multi-byte values in network byte order"
    covered_by:
      - "abb/frame"
      - "mongodb/op-msg-ping"
      - "pdl_properties_all/basic"
  - id: "properties.encoding.host"
    inventory: "section 1, Properties"
    summary: "encoding = \"host\": multi-byte values in host byte order"
    covered_by:
      - "pdl_encoding_host/little-endian"
  - id: "properties.encoding.ascii"
    inventory: "section 1, Properties"
    summary: "encoding = \"ASCII\" (maps to UNKNOWN)"
    covered_by:
      - "pdl_encoding_ascii/text"
  - id: "properties.encoding.unicode"
    inventory: "section 1, Properties"
    summary: "encoding = \"UNICODE\" (maps to UNKNOWN)"
    covered_by:
      - "pdl_encoding_unicode/text"
  - id: "properties.encoding.default"
    inventory: "section 1, Properties"
    summary: "encoding omitted (UNKNOWN)"
    covered_by:
      - "pdl_properties_minimal/basic"
  - id: "struct.plain"
    inventory: "section 1, Attributes: struct"
    summary: "struct of plain fields; every field is a SCOPE_PACKET attribute"
    covered_by:
      - "abb/frame"
      - "cotp/cr"
      - "cotp/dt-s7"
      - "pdl_properties_all/basic"
      - "pdl_struct_types/all-types"
      - "radius/access-accept"
      - "radius/access-request"
      - "s7com/setup-communication"
      - "s7com/setup-communication-ack"
