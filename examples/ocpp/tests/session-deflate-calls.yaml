# Session test of examples/ocpp, written from the OCPP-J 1.6 and OCPP 1.6
# specifications, RFC 6455 and RFC 7692 (permessage-deflate, #107): its
# packets run in order, one TCP connection. Format and rules:
# tests/corpus/README.md, Session files
schema: 1
id: "ocpp/session-deflate-calls"
model: "ocpp"
summary: "permessage-deflate negotiated: a compressed BootNotification from the client (masked) and its compressed CALLRESULT, linked; two Heartbeats whose second refers to the first (context takeover), and their answers"
