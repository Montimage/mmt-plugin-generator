# Packet test of examples/radius, ported from tests/corpus/models/radius/packets/access-accept.yaml.
# Format and rules: tests/corpus/README.md
schema: 1
id: "radius/access-accept"
model: "radius"
summary: "Access-Accept telling the NAS to telnet nemo to 192.168.1.3 (RFC 2865 section 7.1)"
parent:
  kind: "stack"
  path:
    - "ethernet"
    - "ip"
    - "udp"
  selector: "UDP port 1812"
  source: "RFC 2865 section 3"
bytes:
  - "02 00 00 26 86 fe 22 0e 76 24 ba 2a 10 05 f6 bf"
  - "9b 55 e0 b2 06 06 00 00 00 01 0f 06 00 00 00 00"
  - "0e 06 c0 a8 01 03"
bytes_source: "RFC 2865 section 7.1, the Access-Accept hex dump, byte for byte"
expect:
  protocol: "RADIUS_EXAMPLE"
  proto_id: 987
  next:
    kind: "none"
    source: "model-declared: encapsulation is false, so no next protocol"
  attributes:
    - name: "code"
      type: "MMT_U8_DATA"
      offset: 0
      length: 1
      value: 2
      source: "RFC 2865 section 3 Code, byte 0"
    - name: "rid"
      type: "MMT_U8_DATA"
      offset: 1
      length: 1
      value: 0
      source: "RFC 2865 section 3 Identifier, byte 1"
    - name: "rlen"
      type: "MMT_U16_DATA"
      offset: 2
      length: 2
      value: 38
      source: "RFC 2865 section 3 Length, bytes 2-3"
    - name: "authenticator"
      type: "MMT_BINARY_DATA"
      offset: 4
      length: 16
      value: "86 fe 22 0e 76 24 ba 2a 10 05 f6 bf 9b 55 e0 b2"
      source: "RFC 2865 section 3 Response Authenticator, 16 octets at sizeof(struct radiushdr) = 4"
    - name: "Service_Type"
      type: "MMT_U32_DATA"
      offset: 22
      length: 4
      value: 1
      source: "RFC 2865 section 7.1: Service-Type = Login (1)"
    - name: "User_Name"
      type: "MMT_BINARY_DATA"
      status: "absent"
      source: "RFC 2865 section 5: the packet has no attribute of type 1"
    - name: "NAS_Port"
      type: "MMT_U32_DATA"
      status: "absent"
      source: "RFC 2865 section 5: the packet has no attribute of type 5"
note: "Login-Service (type 15) and Login-IP-Host (type 14) are in the packet but not in the model."
