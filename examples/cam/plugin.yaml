# Port of plugins/cam_plugin (ETSI EN 302 637-2 CAM). Only bytes 0-7 have a
# byte-aligned UPER layout; the other attributes keep the model's offsets.
schema: 1
protocol:
  label: cam_example
  id: 978
  context: false
  session: false
  encapsulation: false
  encoding: network
sdk:
  profile: "1.10.2"
parents:
  - protocol: udp
    classify:
      match:
        - {offset: 8, length: 2, value: 0x0202}   # protocolVersion 2, messageID cam(2)
      offset: 8
attributes:
  - name: protocolVersion
    type: MMT_U8_DATA
    offset: 0
    length: sizeof(char)
  - name: messageID
    type: MMT_U8_DATA
    offset: 1
    length: sizeof(char)
  - name: stationID
    type: MMT_U32_DATA
    offset: 2
    length: sizeof(int)
  - name: generationTime
    type: MMT_U16_DATA
    offset: 6
    length: sizeof(short)
  - name: mobileItsStation
    type: MMT_U8_DATA
    offset: 10
    length: sizeof(char)
  - name: privateItsStation
    type: MMT_U8_DATA
    offset: 10
    length: sizeof(char)
  - name: physicalRelevantItsStation
    type: MMT_U8_DATA
    offset: 10
    length: sizeof(char)
  - name: longitude_hem
    type: MMT_U32_DATA
    offset: 11
    length: sizeof(int)
  - name: longitude_deg
    type: MMT_U32_DATA
    offset: 11
    length: sizeof(int)
  - name: latitude_hem
    type: MMT_U32_DATA
    offset: 15
    length: sizeof(int)
  - name: latitude_deg
    type: MMT_U32_DATA
    offset: 15
    length: sizeof(int)
  - name: elevation
    type: MMT_U32_DATA
    offset: 19
    length: sizeof(int)
  - name: direction
    type: MMT_U16_DATA
    offset: 22
    length: sizeof(short)
