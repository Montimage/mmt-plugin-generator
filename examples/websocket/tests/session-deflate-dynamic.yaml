id: "websocket/session-deflate-dynamic"
model: "websocket"
summary: "A 396-byte JSON text compressed with dynamic Huffman codes (BTYPE 10), from the client, masked"
source: "RFC 6455 section 4 (the opening handshake) and 5 (framing); RFC 7692 section 7 (permessage-deflate), RFC 1951 section 3.2.7 (dynamic Huffman codes); Python zlib's raw DEFLATE (wbits=-15) of the text, whose first block has BTYPE 10; the WebSocket layer's session state, examples/README.md, WebSocket"
