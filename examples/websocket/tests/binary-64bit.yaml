# Packet test of examples/websocket, written from RFC 6455 (not a port: the
# corpus has no WebSocket model). Format and rules: tests/corpus/README.md
schema: 1
id: "websocket/binary-64bit"
model: "websocket"
summary: "The first segment of a 64 KiB binary message in one unmasked frame: a 64-bit length"
parent:
  kind: "stack"
  path:
    - "ethernet"
    - "ip"
    - "tcp"
  selector: "TCP, after an HTTP Upgrade to websocket (any port)"
  source: "RFC 6455 section 1.7 (over TCP) and section 4 (the opening handshake)"
bytes:
  - "82 7f 00 00 00 00 00 01 00 00 00 01 02 03 04 05"
  - "06 07 08 09 0a 0b 0c 0d 0e 0f"
bytes_source: "RFC 6455 section 5.7: \"64KiB binary message in a single unmasked frame\", 0x82 0x7F 0x0000000000010000 then 65536 bytes; the segment has the header and the first 16 bytes, 00 to 0f (the RFC leaves them open)"
expect:
  protocol: "WEBSOCKET_EXAMPLE"
  proto_id: 992
  next:
    kind: "none"
    source: "model-declared: encapsulation is false, so no next protocol"
  attributes:
    - name: "handshake"
      type: "MMT_U8_DATA"
      offset: 0
      length: 1
      value: 0
      source: "RFC 6455 section 5.2: the segment is frame data (base framing), not an HTTP message of section 4"
    - name: "fin"
      type: "MMT_U8_DATA"
      offset: 0
      length: 1
      value: 1
      source: "RFC 6455 section 5.2: FIN, the most significant bit of byte 0"
    - name: "rsv1"
      type: "MMT_U8_DATA"
      offset: 0
      length: 1
      value: 0
      source: "RFC 6455 section 5.2: RSV1, bit 1 of byte 0, 0 without an extension"
    - name: "rsv2"
      type: "MMT_U8_DATA"
      offset: 0
      length: 1
      value: 0
      source: "RFC 6455 section 5.2: RSV2, bit 2 of byte 0"
    - name: "rsv3"
      type: "MMT_U8_DATA"
      offset: 0
      length: 1
      value: 0
      source: "RFC 6455 section 5.2: RSV3, bit 3 of byte 0"
    - name: "opcode"
      type: "MMT_U8_DATA"
      offset: 0
      length: 1
      value: 2
      source: "RFC 6455 section 5.2: opcode, the low 4 bits of byte 0"
    - name: "mask"
      type: "MMT_U8_DATA"
      offset: 1
      length: 1
      value: 0
      source: "RFC 6455 section 5.2: MASK, the most significant bit of byte 1"
    - name: "payload_len"
      type: "MMT_U64_DATA"
      offset: 1
      length: 9
      value: 65536
      source: "RFC 6455 section 5.2: 127 in the low 7 bits of byte 1, then a 64-bit length in bytes 2-9"
    - name: "masking_key"
      type: "MMT_U32_DATA"
      status: "absent"
      source: "RFC 6455 section 5.2: no Masking-key when MASK is 0"
    - name: "payload_offset"
      type: "MMT_U32_DATA"
      offset: 0
      length: 10
      value: 10
      source: "RFC 6455 section 5.2: the payload follows the 2-byte header, the extended length and the masking key"
    - name: "payload"
      type: "MMT_BINARY_VAR_DATA"
      offset: 10
      length: 16
      value: "00 01 02 03 04 05 06 07 08 09 0a 0b 0c 0d 0e 0f"
      source: "RFC 6455 section 5.2: the payload bytes in the segment; the frame's other 65520 bytes come in later segments"
    - name: "frame_count"
      type: "MMT_U32_DATA"
      offset: 0
      length: 26
      value: 1
      source: "RFC 6455 section 5.2: the frames whose header ends in the segment"
    - name: "carried_len"
      type: "MMT_U32_DATA"
      offset: 0
      length: 1
      value: 0
      source: "RFC 6455 section 5.2: the segment starts with a frame header, so no bytes of an earlier frame"
    - name: "message_opcode"
      type: "MMT_U8_DATA"
      offset: 0
      length: 1
      value: 2
      source: "RFC 6455 section 5.4: a data frame's own opcode is its message's"
    - name: "close_code"
      type: "MMT_U16_DATA"
      status: "absent"
      source: "RFC 6455 section 5.5.1: not a close frame"
    - name: "status_code"
      type: "MMT_U16_DATA"
      status: "absent"
      source: "RFC 6455 section 5.2: frame data has no HTTP status line"
