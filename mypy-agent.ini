# Mypy for the agent (src/mmt_plugin_agent) and its tests, which need the
# agent extra (Python 3.11+): `uv sync --extra agent`, then
#   uv run mypy --config-file mypy-agent.ini
# The default `uv run mypy` (pyproject.toml) excludes them.
[mypy]
files = src/mmt_plugin_agent, tests/unit/agent
mypy_path = src:skills/mmt-plugin-generator/evals:skills/mmt-plugin-generator/scripts
strict = true
warn_unreachable = true

# jsonschema (dev group, tests only) ships no type information.
[mypy-jsonschema,jsonschema.*]
ignore_missing_imports = true
