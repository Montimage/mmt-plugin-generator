# Packet test of examples/tpkt, ported from tests/corpus/models/tpkt/packets/dt-s7.yaml.
# Format and rules: tests/corpus/README.md
schema: 1
id: "tpkt/dt-s7"
model: "tpkt"
summary: "TPKT carrying a COTP DT TPDU with an S7comm job"
parent:
  kind: "stack"
  path:
    - "ethernet"
    - "ip"
    - "tcp"
  selector: "TCP port 102"
  source: "RFC 1006 section 5 (TCP port 102)"
bytes:
  - "03 00 00 19 02 f0 80 32 01 00 00 04 00 00 08 00"
  - "00 f0 00 00 01 00 01 01 e0"
bytes_source: "RFC 1006 section 6: version 3, reserved 0, packet length including the 4-byte header; the TPDU is the cotp/dt-s7 fixture"
expect:
  protocol: "TPKT_EXAMPLE"
  proto_id: 991
  next:
    kind: "proto"
    proto_id: 979
    offset: 4
    source: "RFC 1006 section 6: version 3, the TPDU follows the 4-byte TPKT header; the TPDU is COTP, the cotp example (979)"
  attributes:
    - name: "version"
      type: "MMT_U8_DATA"
      offset: 0
      length: 1
      value: 3
      source: "RFC 1006 section 6: vrsn, 8 bits, always 3"
    - name: "reserved"
      type: "MMT_U8_DATA"
      offset: 1
      length: 1
      value: 0
      source: "RFC 1006 section 6: reserved, 8 bits"
    - name: "length"
      type: "MMT_U16_DATA"
      offset: 2
      length: 2
      value: 25
      source: "RFC 1006 section 6: packet length, 16 bits, the whole TPKT including the header"
