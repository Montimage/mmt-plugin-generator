# Session test of examples/ocpp, written from the OCPP-J 1.6 and OCPP 1.6
# specifications, RFC 6455 and RFC 7692 (permessage-deflate, #107): its
# packets run in order, one TCP connection. Format and rules:
# tests/corpus/README.md, Session files
schema: 1
id: "ocpp/session-deflate-no-takeover"
model: "ocpp"
summary: "server_no_context_takeover and client_no_context_takeover with server_max_window_bits=12 and client_max_window_bits=10, in the second segment of the answer: each message is inflated from an empty window, so a message that refers to the one before is not reported, a self-contained one is"
source: "OCPP-J 1.6 section 3 (the ocpp1.6 subprotocol) and 4 (CALL, CALLRESULT, CALLERROR), OCPP 1.6 section 6, RFC 6455; RFC 7692 section 7 (permessage-deflate), section 7.1.1 (context takeover control) and 7.1.2 (window bits); each message Python zlib's raw DEFLATE of its OCPP-J text, with the direction's window bits (wbits=-10, -12); the layer's session state, examples/README.md, OCPP 1.6-J"
session:
  through: "tcp:dport=9000,sport=49231"
  protocol: "OCPP_EXAMPLE"
  proto_id: 993
  attributes:
    - name: "action"
      type: "MMT_STRING_DATA"
    - name: "charging_limit_x10"
      type: "MMT_U32_DATA"
    - name: "charging_rate_unit"
      type: "MMT_STRING_DATA"
    - name: "connector_id"
      type: "MMT_U32_DATA"
    - name: "error_code"
      type: "MMT_STRING_DATA"
    - name: "error_description"
      type: "MMT_STRING_DATA"
    - name: "id_tag"
      type: "MMT_STRING_DATA"
    - name: "message_count"
      type: "MMT_U32_DATA"
    - name: "message_type_id"
      type: "MMT_U8_DATA"
    - name: "payload"
      type: "MMT_BINARY_VAR_DATA"
    - name: "unique_id"
      type: "MMT_STRING_DATA"
