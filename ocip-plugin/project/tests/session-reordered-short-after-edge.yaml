# Session test of the ocip plugin (mmt-security rule 232), written from the OCI-P wire format:
# its packets run in order, one TCP connection. Format and rules: tests/corpus/README.md, Session files
schema: 1
id: "ocip/session-reordered-short-after-edge"
model: "ocip"
summary: "Limit, pinned: ...<!DOC, then Y after a 1-byte hole, then the late T, then PE ...; the keyword needs bytes after the hole that arrive after the late segment, so has_dtd is 0 everywhere"
source: "gen_pcaps.py attack_v7_split, cut at '<!DOC', 'T' and 'Y'; T sent after Y"
session:
  through: "tcp:dport=2208,sport=42003"
  protocol: "OCIP"
  proto_id: 960
  attributes:
    - name: "has_dtd"
      type: "MMT_U8_DATA"
    - name: "dtd"
      type: "MMT_STRING_DATA"
    - name: "command_type"
      type: "MMT_STRING_DATA"
    - name: "session_id"
      type: "MMT_STRING_DATA"
    - name: "is_request"
      type: "MMT_U8_DATA"
packets:
  - open: true
  - from: "client"
    text: "...<!DOC"
    bytes:
      - "3c 3f 78 6d 6c 20 76 65 72 73 69 6f 6e 3d 22 31"
      - "2e 30 22 20 65 6e 63 6f 64 69 6e 67 3d 22 55 54"
      - "46 2d 38 22 3f 3e 3c 21 44 4f 43"
    expect:
      attributes:
        - name: "has_dtd"
          value: 0
        - name: "is_request"
          value: 1
  - from: "client"
    lost: 1
    text: "Y (T not yet seen)"
    bytes:
      - "59"
    expect:
      attributes:
        - name: "has_dtd"
          value: 0
        - name: "is_request"
          value: 1
  - from: "client"
    back: 2
    text: "T, late"
    bytes:
      - "54"
    expect:
      attributes:
        - name: "has_dtd"
          value: 0
        - name: "is_request"
          value: 1
  - from: "client"
    text: "PE ..., in order"
    bytes:
      - "50 45 20 42 72 6f 61 64 73 6f 66 74 44 6f 63 75"
      - "6d 65 6e 74 20 53 59 53 54 45 4d 20 22 68 74 74"
      - "70 3a 2f 2f 32 30 33 2e 30 2e 31 31 33 2e 35 30"
      - "2f 6f 63 69 2e 64 74 64 22 3e 3c 42 72 6f 61 64"
      - "73 6f 66 74 44 6f 63 75 6d 65 6e 74 20 70 72 6f"
      - "74 6f 63 6f 6c 3d 22 4f 43 49 22 20 78 6d 6c 6e"
      - "73 3d 22 43 22 20 78 6d 6c 6e 73 3a 78 73 69 3d"
      - "22 68 74 74 70 3a 2f 2f 77 77 77 2e 77 33 2e 6f"
      - "72 67 2f 32 30 30 31 2f 58 4d 4c 53 63 68 65 6d"
      - "61 2d 69 6e 73 74 61 6e 63 65 22 3e 3c 73 65 73"
      - "73 69 6f 6e 49 64 20 78 6d 6c 6e 73 3d 22 22 3e"
      - "61 31 62 32 63 33 64 34 65 35 66 36 3c 2f 73 65"
      - "73 73 69 6f 6e 49 64 3e 3c 63 6f 6d 6d 61 6e 64"
      - "20 78 73 69 3a 74 79 70 65 3d 22 41 75 74 68 65"
      - "6e 74 69 63 61 74 69 6f 6e 52 65 71 75 65 73 74"
      - "22 20 78 6d 6c 6e 73 3d 22 22 3e 3c 75 73 65 72"
      - "49 64 3e 61 64 6d 69 6e 3c 2f 75 73 65 72 49 64"
      - "3e 3c 2f 63 6f 6d 6d 61 6e 64 3e 3c 2f 42 72 6f"
      - "61 64 73 6f 66 74 44 6f 63 75 6d 65 6e 74 3e 0a"
    expect:
      attributes:
        - name: "has_dtd"
          value: 0
        - name: "session_id"
          value: "61 31 62 32 63 33 64 34 65 35 66 36"
          text: "a1b2c3d4e5f6"
        - name: "command_type"
          value: "41 75 74 68 65 6e 74 69 63 61 74 69 6f 6e 52 65 71 75 65 73 74"
          text: "AuthenticationRequest"
        - name: "is_request"
          value: 1
