# Session test of examples/ocpp, written from the OCPP-J 1.6 and OCPP 1.6
# specifications and RFC 6455 (not a port: the corpus has no OCPP model):
# its packets run in order, one TCP connection. Format and rules:
# tests/corpus/README.md, Session files
schema: 1
id: "ocpp/session-chat-subprotocol"
model: "ocpp"
summary: "A WebSocket session for another subprotocol, with an OCPP-J shaped frame: not OCPP"
source: "OCPP-J 1.6 section 3 (the ocpp1.6 subprotocol) and 4 (CALL, CALLRESULT, CALLERROR), OCPP 1.6 section 6, RFC 6455; the layer's session state, examples/README.md, OCPP 1.6-J"
session:
  through: "tcp:dport=9000,sport=49203"
  protocol: "OCPP_EXAMPLE"
  proto_id: 993
  attributes:
    - name: "action"
      type: "MMT_STRING_DATA"
    - name: "charging_limit_x10"
      type: "MMT_U32_DATA"
    - name: "charging_rate_unit"
      type: "MMT_STRING_DATA"
    - name: "connector_id"
      type: "MMT_U32_DATA"
    - name: "error_code"
      type: "MMT_STRING_DATA"
    - name: "error_description"
      type: "MMT_STRING_DATA"
    - name: "id_tag"
      type: "MMT_STRING_DATA"
    - name: "message_count"
      type: "MMT_U32_DATA"
    - name: "message_type_id"
      type: "MMT_U8_DATA"
    - name: "payload"
      type: "MMT_BINARY_VAR_DATA"
    - name: "unique_id"
      type: "MMT_STRING_DATA"
packets:
  - open: true
  - from: "client"
    text: "GET /chat HTTP/1.1\r\nHost: server.example.com\r\nUpgrade: websocket\r\nConnection: Upgrade\r\nSec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==\r\nOrigin: http://example.com\r\nSec-WebSocket-Protocol: chat, superchat\r\nSec-WebSocket-Version: 13\r\n\r\n"
