# Session test of examples/websocket, written from RFC 6455 (not a port:
# the corpus has no WebSocket model): its packets run in order, one TCP
# connection. Format and rules: tests/corpus/README.md, Session files
schema: 1
id: "websocket/session-plain-http"
model: "websocket"
summary: "Plain HTTP on the same port: not WebSocket"
source: "RFC 6455 section 1.2, 4 (the opening handshake) and 5 (framing); the WebSocket layer's session state, examples/README.md, WebSocket"
session:
  through: "tcp:dport=8080,sport=49154"
  protocol: "WEBSOCKET_EXAMPLE"
  proto_id: 992
  attributes:
    - name: "accept"
      type: "MMT_STRING_DATA"
    - name: "carried_len"
      type: "MMT_U32_DATA"
    - name: "close_code"
      type: "MMT_U16_DATA"
    - name: "fin"
      type: "MMT_U8_DATA"
    - name: "frame_count"
      type: "MMT_U32_DATA"
    - name: "handshake"
      type: "MMT_U8_DATA"
    - name: "key"
      type: "MMT_STRING_DATA"
    - name: "mask"
      type: "MMT_U8_DATA"
    - name: "masking_key"
      type: "MMT_U32_DATA"
    - name: "message_opcode"
      type: "MMT_U8_DATA"
    - name: "opcode"
      type: "MMT_U8_DATA"
    - name: "payload"
      type: "MMT_BINARY_VAR_DATA"
    - name: "payload_len"
      type: "MMT_U64_DATA"
    - name: "payload_offset"
      type: "MMT_U32_DATA"
    - name: "rsv1"
      type: "MMT_U8_DATA"
    - name: "rsv2"
      type: "MMT_U8_DATA"
    - name: "rsv3"
      type: "MMT_U8_DATA"
    - name: "status_code"
      type: "MMT_U16_DATA"
    - name: "subprotocol"
      type: "MMT_STRING_DATA"
packets:
  - open: true
  - from: "client"
    text: "GET /chat HTTP/1.1\r\nHost: server.example.com\r\n\r\n"
    bytes:
      - "47 45 54 20 2f 63 68 61 74 20 48 54 54 50 2f 31"
      - "2e 31 0d 0a 48 6f 73 74 3a 20 73 65 72 76 65 72"
      - "2e 65 78 61 6d 70 6c 65 2e 63 6f 6d 0d 0a 0d 0a"
    expect: "none"
  - from: "server"
    text: "HTTP/1.1 200 OK\r\nContent-Length: 0\r\n\r\n"
    bytes:
      - "48 54 54 50 2f 31 2e 31 20 32 30 30 20 4f 4b 0d"
      - "0a 43 6f 6e 74 65 6e 74 2d 4c 65 6e 67 74 68 3a"
      - "20 30 0d 0a 0d 0a"
    expect: "none"
