  - "6f 70 81 92 a3 b4 c5 d6"
bytes_source: "ETSI EN 302 637-2 V1.4.1 Annex A: CAM ::= SEQUENCE { header ItsPduHeader, cam CoopAwareness }, CoopAwareness starts with generationDeltaTime; bytes 8-23 are filler, not a valid CamParameters encoding"
