# Corpus packet ethernet/lldp. Format and rules: tests/corpus/README.md
schema: 1
id: "ethernet/lldp"
model: "ethernet"
summary: "Ethernet II frame carrying LLDP: no case matches"
constructs:
  - "classifynext.switch"
  - "expr.val"
  - "expr.sizeof.struct"
  - "define.hex"
  - "define.decimal"
  - "properties.encapsulation"
  - "struct.type.mmt"
  - "classifynext.default"
parent:
  kind: "link"
  path: []
  selector: "the bytes are a whole frame (pcap LINKTYPE_ETHERNET = 1, no FCS)"
  source: "IEEE 802.3 clause 3.1.1 (MAC frame format)"
bytes:
  - "00 00 5e 00 53 0a 00 00 5e 00 53 0b 88 cc 02 07"
  - "04 00 00 5e 00 53 0b 04 07 03 00 00 5e 00 53 0b"
  - "06 02 00 78 00 00"
bytes_source: "IEEE 802.3 clause 3.1.1 (destination, source, type); EtherType 0x88CC per the IANA IEEE 802 Numbers registry; chassis ID, port ID, TTL and end TLVs per IEEE 802.1AB; MACs from RFC 7042 section 2.1.2"
expect:
  protocol: "ETHERNET"
  proto_id: 12
  next:
    kind: "none"
    source: "model-declared: no case matches 0x88CC and default only breaks"
  attributes:
    - name: "h_dest"
      type: "MMT_DATA_MAC_ADDR"
      offset: 0
      length: 6
      value: "00:00:5e:00:53:0a"
      source: "IEEE 802.3 clause 3.1.1: destination address, bytes 0-5"
    - name: "h_source"
      type: "MMT_DATA_MAC_ADDR"
      offset: 6
      length: 6
      value: "00:00:5e:00:53:0b"
      source: "IEEE 802.3 clause 3.1.1: source address, bytes 6-11"
    - name: "h_proto"
      type: "MMT_U16_DATA"
      offset: 12
      length: 2
      value: 35020
      source: "IEEE 802.3 clause 3.1.1: Length/Type field, bytes 12-13"
    - name: "src"
      type: "MMT_DATA_MAC_ADDR"
      status: "undefined"
      reason: "data_len sizeof (mac_addr_t) does not parse"
      spec:
        offset: 6
        length: 6
        value: "00:00:5e:00:53:0b"
        byte_order: "none"
        source: "IEEE 802.3 clause 3.1.1: source address at byte 6 (the model declares offset 0)"
      source: "IEEE 802.3 clause 3.1.1: the source address is the second address field"
    - name: "dst"
      type: "MMT_DATA_MAC_ADDR"
      status: "undefined"
      reason: "data_len sizeof (mac_addr_t) does not parse"
      spec:
        offset: 0
        length: 6
        value: "00:00:5e:00:53:0a"
        byte_order: "none"
        source: "IEEE 802.3 clause 3.1.1: destination address at byte 0 (the model declares offset 2)"
      source: "IEEE 802.3 clause 3.1.1: the destination address is the first address field"
