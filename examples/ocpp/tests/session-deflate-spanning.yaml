# Session test of examples/ocpp, written from the OCPP-J 1.6 and OCPP 1.6
# specifications, RFC 6455 and RFC 7692 (permessage-deflate, #107): its
# packets run in order, one TCP connection. Format and rules:
# tests/corpus/README.md, Session files
schema: 1
id: "ocpp/session-deflate-spanning"
model: "ocpp"
summary: "A compressed StartTransaction over two segments from the client, masked: the first segment reports nothing, the second the message (its typed fields), and the server's compressed answer is linked to it"
source: "OCPP-J 1.6 section 3 (the ocpp1.6 subprotocol) and 4 (CALL, CALLRESULT, CALLERROR), OCPP 1.6 section 6, RFC 6455; RFC 7692 section 7 (permessage-deflate), RFC 6455 section 5.3 (the masking key goes on over the payload); each message Python zlib's raw DEFLATE (wbits=-15) of its OCPP-J text; the layer's session state, examples/README.md, OCPP 1.6-J"
session:
  through: "tcp:dport=9000,sport=49235"
  protocol: "OCPP_EXAMPLE"
  proto_id: 993
