# Session test of examples/ocpp, written from the OCPP-J 1.6 and OCPP 1.6
# specifications, RFC 6455 and RFC 7692 (permessage-deflate, #107): its
# packets run in order, one TCP connection. Format and rules:
# tests/corpus/README.md, Session files
schema: 1
id: "ocpp/session-deflate-lost"
model: "ocpp"
summary: "The capture loses a whole compressed message from the client: the window's history is gone, so the next message, which refers to it, is not reported; a self-contained one is; then bytes inside a compressed frame from the server: that message is not reported, and the window loses its history"
source: "OCPP-J 1.6 section 3 (the ocpp1.6 subprotocol) and 4 (CALL, CALLRESULT, CALLERROR), OCPP 1.6 section 6, RFC 6455; RFC 7692 section 7 (permessage-deflate), section 7.2.3.2 (a lost message's bytes may have changed the window); each message Python zlib's raw DEFLATE (wbits=-15) of its OCPP-J text, the self-contained ones from an empty window; the server's first CALL in two stored blocks, RFC 1951 section 3.2.4; the layer's session state, examples/README.md, OCPP 1.6-J"
session:
  through: "tcp:dport=9000,sport=49233"
  protocol: "OCPP_EXAMPLE"
  proto_id: 993
  attributes:
    - name: "action"
      type: "MMT_STRING_DATA"
    - name: "charging_limit_x10"
      type: "MMT_U32_DATA"
    - name: "charging_rate_unit"
      type: "MMT_STRING_DATA"
    - name: "connector_id"
      type: "MMT_U32_DATA"
    - name: "error_code"
      type: "MMT_STRING_DATA"
    - name: "error_description"
      type: "MMT_STRING_DATA"
    - name: "id_tag"
      type: "MMT_STRING_DATA"
    - name: "message_count"
      type: "MMT_U32_DATA"
    - name: "message_type_id"
      type: "MMT_U8_DATA"
    - name: "payload"
      type: "MMT_BINARY_VAR_DATA"
    - name: "unique_id"
      type: "MMT_STRING_DATA"
