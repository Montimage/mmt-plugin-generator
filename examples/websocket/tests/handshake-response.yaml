# Packet test of examples/websocket, written from RFC 6455 (not a port: the
# corpus has no WebSocket model). Format and rules: tests/corpus/README.md
schema: 1
id: "websocket/handshake-response"
model: "websocket"
summary: "The server's opening handshake (the RFC 6455 section 1.2 example)"
parent:
  kind: "stack"
  path:
    - "ethernet"
    - "ip"
    - "tcp"
  selector: "TCP, after an HTTP Upgrade to websocket (any port)"
  source: "RFC 6455 section 1.7 (over TCP) and section 4 (the opening handshake)"
bytes:
  - "48 54 54 50 2f 31 2e 31 20 31 30 31 20 53 77 69"
  - "74 63 68 69 6e 67 20 50 72 6f 74 6f 63 6f 6c 73"
  - "0d 0a 55 70 67 72 61 64 65 3a 20 77 65 62 73 6f"
  - "63 6b 65 74 0d 0a 43 6f 6e 6e 65 63 74 69 6f 6e"
  - "3a 20 55 70 67 72 61 64 65 0d 0a 53 65 63 2d 57"
  - "65 62 53 6f 63 6b 65 74 2d 41 63 63 65 70 74 3a"
  - "20 73 33 70 50 4c 4d 42 69 54 78 61 51 39 6b 59"
  - "47 7a 7a 68 5a 52 62 4b 2b 78 4f 6f 3d 0d 0a 53"
  - "65 63 2d 57 65 62 53 6f 63 6b 65 74 2d 50 72 6f"
  - "74 6f 63 6f 6c 3a 20 63 68 61 74 0d 0a 0d 0a"
bytes_source: "RFC 6455 section 1.2, the server's handshake, CR LF line ends (RFC 7230 section 3)"
expect:
  protocol: "WEBSOCKET_EXAMPLE"
  proto_id: 992
  next:
    kind: "none"
    source: "model-declared: encapsulation is false, so no next protocol"
  attributes:
    - name: "handshake"
      type: "MMT_U8_DATA"
      offset: 0
      length: 8
      value: 2
      source: "RFC 6455 section 4.2.2: the server's answer, an HTTP status line"
    - name: "status_code"
      type: "MMT_U16_DATA"
      offset: 9
      length: 3
      value: 101
      source: "RFC 6455 section 1.2 and 4.2.2: 101 Switching Protocols"
    - name: "accept"
      type: "MMT_STRING_DATA"
      offset: 97
      length: 28
      value: "73 33 70 50 4c 4d 42 69 54 78 61 51 39 6b 59 47 7a 7a 68 5a 52 62 4b 2b 78 4f 6f 3d"
      text: "s3pPLMBiTxaQ9kYGzzhZRbK+xOo="
      source: "RFC 6455 section 1.3: Sec-WebSocket-Accept of the key dGhlIHNhbXBsZSBub25jZQ=="
    - name: "subprotocol"
      type: "MMT_STRING_DATA"
      offset: 151
      length: 4
      value: "63 68 61 74"
      text: "chat"
      source: "RFC 6455 section 1.2 and 4.2.2: Sec-WebSocket-Protocol, the one subprotocol the server selected"
    - name: "key"
      type: "MMT_STRING_DATA"
      status: "absent"
      source: "RFC 6455 section 4.2.2: the answer has no Sec-WebSocket-Key"
    - name: "opcode"
      type: "MMT_U8_DATA"
      status: "absent"
      source: "no frame header in the segment: an HTTP message of the opening handshake"
    - name: "frame_count"
      type: "MMT_U32_DATA"
      status: "absent"
      source: "no frame header in the segment: an HTTP message of the opening handshake"
