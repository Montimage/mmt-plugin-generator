      offset: 0
      length: 1
      value: 3
      source: "RFC 1006 section 6: vrsn, 8 bits, always 3"
    - name: "reserved"
      type: "MMT_U8_DATA"
      offset: 1
      length: 1
      value: 0
      source: "RFC 1006 section 6: reserved, 8 bits"
    - name: "length"
      type: "MMT_U16_DATA"
      offset: 2
      length: 2
      value: 22
      source: "RFC 1006 section 6: packet length, 16 bits, the whole TPKT including the header"
