    - "udp"
  selector: "UDP payload starting 02 02 (protocolVersion 2, messageID cam(2))"
  source: "plugins/cam_plugin_src/cam_mmt_plugin.c (hand-written classification on UDP); ETSI's own transport is BTP-B (ETSI EN 302 636-5-1)"
bytes:
