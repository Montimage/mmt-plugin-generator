    text: "GET /webServices/ocpp/CP3211 HTTP/1.1\r\nHost: some.server.com:33033\r\nUpgrade: websocket\r\nConnection: Upgrade\r\nSec-WebSocket-Key: x3JJHMbDL1EzLkh9GBhXDw==\r\nSec-WebSocket-Protocol: ocpp1.6, ocpp1.5\r\nSec-WebSocket-Version: 13\r\n\r\n"
