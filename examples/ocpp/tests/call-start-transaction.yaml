# Packet test of examples/ocpp, written from the OCPP-J 1.6 and OCPP 1.6
# specifications (not a port: the corpus has no OCPP model). Format and
# rules: tests/corpus/README.md
schema: 1
id: "ocpp/call-start-transaction"
model: "ocpp"
summary: "A CALL, StartTransaction, with its connectorId and idTag (a masked client frame)"
parent:
  kind: "stack"
  path:
    - "ethernet"
    - "ip"
    - "tcp"
  selector: "TCP, a WebSocket session whose opening handshake offers ocpp1.6 (any port)"
  source: "OCPP-J 1.6 section 3 (OCPP over WebSocket, subprotocol ocpp1.6) and RFC 6455 section 1.7 (over TCP)"
bytes:
  - "81 f8 37 fa 21 3d 6c c8 0d 1f 06 c3 13 0f 04 c8"
  - "11 08 15 d6 03 6e 43 9b 53 49 63 88 40 53 44 9b"
  - "42 49 5e 95 4f 1f 1b 81 03 5e 58 94 4f 58 54 8e"
  - "4e 4f 7e 9e 03 07 06 d6 03 54 53 ae 40 5a 15 c0"
  - "03 7f 03 bc 17 0f 74 bf 67 1f 1b d8 4c 58 43 9f"
  - "53 6e 43 9b 53 49 15 c0 11 11 15 8e 48 50 52 89"
  - "55 5c 5a 8a 03 07 15 c8 11 0c 04 d7 11 0f 1a ca"
  - "10 69 06 cf 1b 0d 0e c0 10 05 6d d8 5c 60"
bytes_source: "OCPP-J 1.6 section 4.2.1, the CALL syntax, Action StartTransaction (OCPP 1.6 section 4.8; StartTransaction.req, section 6.45: connectorId, idTag, meterStart, timestamp), compact JSON, in one masked text frame (RFC 6455 section 5.2, the key of section 5.7)"
expect:
  protocol: "OCPP_EXAMPLE"
  proto_id: 993
  next:
    kind: "none"
    source: "model-declared: encapsulation is false, so no next protocol"
  attributes:
