      source: "OCPP-J 1.6 section 4.2.1: the Payload, the fourth element, as sent; unmasked (RFC 6455 section 5.3)"
    - name: "connector_id"
      type: "MMT_U32_DATA"
      offset: 54
      length: 1
      value: 1
      source: "OCPP 1.6 section 6.45: StartTransaction.req's connectorId, the payload's top-level integer"
    - name: "id_tag"
