# Session test of examples/websocket, written from RFC 6455 and RFC 7692
# (permessage-deflate, #107): its packets run in order, one TCP connection.
# Format and rules: tests/corpus/README.md, Session files
schema: 1
id: "websocket/session-deflate-spanning"
model: "websocket"
summary: "A compressed frame over two segments, from each side: the second segment has no frame header (no frame fields) and reports the message inflated"
source: "RFC 6455 section 4 (the opening handshake) and 5 (framing); RFC 7692 section 7 (permessage-deflate), Python zlib's raw DEFLATE (wbits=-15) of the text; RFC 6455 section 5.3 (the masking key goes on over the payload); the WebSocket layer's session state, examples/README.md, WebSocket"
session:
  through: "tcp:dport=8080,sport=49180"
  protocol: "WEBSOCKET_EXAMPLE"
  proto_id: 992
  attributes:
    - name: "carried_len"
      type: "MMT_U32_DATA"
    - name: "fin"
      type: "MMT_U8_DATA"
    - name: "frame_count"
      type: "MMT_U32_DATA"
    - name: "handshake"
      type: "MMT_U8_DATA"
    - name: "message_opcode"
      type: "MMT_U8_DATA"
    - name: "opcode"
      type: "MMT_U8_DATA"
    - name: "payload"
      type: "MMT_BINARY_VAR_DATA"
    - name: "payload_inflated"
      type: "MMT_U8_DATA"
    - name: "payload_len"
      type: "MMT_U64_DATA"
    - name: "rsv1"
      type: "MMT_U8_DATA"
packets:
  - open: true
  - from: "client"
    text: "GET /chat HTTP/1.1\r\nHost: server.example.com\r\nUpgrade: websocket\r\nConnection: Upgrade\r\nSec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==\r\nSec-WebSocket-Extensions: permessage-deflate; client_max_window_bits\r\nSec-WebSocket-Version: 13\r\n\r\n"
    bytes:
      - "47 45 54 20 2f 63 68 61 74 20 48 54 54 50 2f 31"
      - "2e 31 0d 0a 48 6f 73 74 3a 20 73 65 72 76 65 72"
      - "2e 65 78 61 6d 70 6c 65 2e 63 6f 6d 0d 0a 55 70"
