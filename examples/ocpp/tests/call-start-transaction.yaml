      type: "MMT_U8_DATA"
      offset: 7
      length: 1
      value: 2
      source: "OCPP-J 1.6 section 4.1.3: MessageTypeId 2, a CALL (a request), the first element of the array"
    - name: "unique_id"
      type: "MMT_STRING_DATA"
      offset: 10
      length: 8
      value: "31 39 32 32 33 32 30 35"
      text: "19223205"
      source: "OCPP-J 1.6 section 4.1.4 and 4.2: the UniqueId, the second element, as sent"
    - name: "action"
      type: "MMT_STRING_DATA"
      offset: 21
      length: 16
      value: "53 74 61 72 74 54 72 61 6e 73 61 63 74 69 6f 6e"
      text: "StartTransaction"
      source: "OCPP-J 1.6 section 4.2.1: the Action, the third element of a CALL"
    - name: "payload"
      type: "MMT_BINARY_VAR_DATA"
      offset: 39
      length: 86
      value: "7b 22 63 6f 6e 6e 65 63 74 6f 72 49 64 22 3a 31 2c 22 69 64 54 61 67 22 3a 22 42 34 46 36 32 43 45 46 22 2c 22 6d 65 74 65 72 53 74 61 72 74 22 3a 30 2c 22 74 69 6d 65 73 74 61 6d 70 22 3a 22 32 30 31 33 2d 30 32 2d 30 31 54 31 35 3a 30 39 3a 31 38 5a 22 7d"
