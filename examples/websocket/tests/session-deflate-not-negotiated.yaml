    bytes:
      - "c1 07 f2 48 cd c9 c9 07 00"
    expect:
      attributes:
        - name: "carried_len"
          value: 0
        - name: "fin"
          value: 1
        - name: "frame_count"
          value: 1
        - name: "handshake"
          value: 0
        - name: "message_opcode"
          value: 1
        - name: "opcode"
          value: 1
        - name: "payload"
          value: "f2 48 cd c9 c9 07 00"
        - name: "payload_inflated"
          value: 2
        - name: "payload_len"
          value: 7
        - name: "rsv1"
          value: 1
  - from: "server"
    bytes:
      - "81 05 48 65 6c 6c 6f"
    expect:
      attributes:
        - name: "carried_len"
          value: 0
        - name: "fin"
          value: 1
        - name: "frame_count"
          value: 1
        - name: "handshake"
          value: 0
        - name: "message_opcode"
          value: 1
        - name: "opcode"
          value: 1
        - name: "payload"
          value: "48 65 6c 6c 6f"
          text: "Hello"
        - name: "payload_inflated"
