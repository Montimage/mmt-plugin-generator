# Corpus packet tpkt/cr. Format and rules: tests/corpus/README.md
schema: 1
id: "tpkt/cr"
model: "tpkt"
summary: "TPKT carrying a COTP CR TPDU"
constructs:
  - "struct.plain"
  - "struct.type.uint8_t"
  - "struct.type.uint16_t"
parent:
  kind: "stack"
  path:
    - "ethernet"
    - "ip"
    - "tcp"
  selector: "TCP port 102"
  source: "RFC 1006 section 5 (TCP port 102)"
bytes:
  - "03 00 00 16 11 e0 00 00 00 01 00 c1 02 01 00 c2"
  - "02 01 02 c0 01 0a"
bytes_source: "RFC 1006 section 6: version 3, reserved 0, packet length including the 4-byte header; the TPDU is the cotp/cr fixture"
expect:
