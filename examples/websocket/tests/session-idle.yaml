# Session test of examples/websocket, written from RFC 6455 (not a port:
# the corpus has no WebSocket model): its packets run in order, one TCP
# connection. Format and rules: tests/corpus/README.md, Session files
schema: 1
id: "websocket/session-idle"
model: "websocket"
summary: "A session idle for 70 s, longer than mmt-dpi's default session timeout (60 s): still the same session, a frame over the gap (#104)"
source: "RFC 6455 section 1.2, 4 (the opening handshake) and 5 (framing); the WebSocket layer's session state, examples/README.md, WebSocket"
session:
  through: "tcp:dport=8080,sport=49158"
  protocol: "WEBSOCKET_EXAMPLE"
