# Session test of examples/ocpp, written from the OCPP-J 1.6 and OCPP 1.6
# specifications, RFC 6455 and RFC 7692 (permessage-deflate, #107): its
# packets run in order, one TCP connection. Format and rules:
# tests/corpus/README.md, Session files
schema: 1
id: "ocpp/session-deflate-unknown-param"
model: "ocpp"
summary: "The answer accepts permessage-deflate with a parameter section 7.1 does not define: a compressed CALL is no OCPP-J message; an uncompressed one is"
source: "OCPP-J 1.6 section 3 (the ocpp1.6 subprotocol) and 4 (CALL, CALLRESULT, CALLERROR), OCPP 1.6 section 6, RFC 6455; RFC 7692 section 7 (permessage-deflate), section 5 and 7.1 (the negotiation: an unknown parameter fails it); the layer's session state, examples/README.md, OCPP 1.6-J"
