models:
  - name: "abb"
    kind: "example"
    origin: "plugins/abb_plugin"
    model: "models/abb/model.pdl"
    encoding: "network"
    valid: true
    java: "compiles"
    spec: "none public: model-declared layout (ABB camera telemetry, UDP port 12118 per plugins/abb_src)"
    packets:
      - "frame"
  - name: "arp"
    kind: "example"
    origin: "plugins/arp_plugin"
    model: "models/arp/model.pdl"
    encoding: "network"
    valid: false
    invalid_reason: "alias ar_pro is declared twice: in struct arphdr and again in the else branch (inventory section 4 and bug 12: conditional attributes skip the duplicate check)"
    java: "compile-fail"
    spec: "RFC 826 (Packet format); RFC 903 (RARP opcodes); IANA ARP hardware types"
    notes: "The fixtures give values for every valid declaration. The duplicate ar_pro in the else branch is meant as the sender hardware address (RFC 826 ar$sha); it has no expected value."
    packets:
      - "request-ethernet-ipv4"
      - "reply-ethernet-ipv4"
      - "request-ieee802"
  - name: "cam"
    kind: "example"
    origin: "plugins/cam_plugin"
    model: "models/cam/model.pdl"
    encoding: "network"
    valid: true
    java: "compile-fail"
    spec: "ETSI EN 302 637-2 V1.4.1 Annex A (CAM-PDU-Descriptions), ETSI TS 102 894-2 V1.3.1 (ItsPduHeader), ITU-T X.691 (UPER)"
    notes: "Only bytes 0-7 (ItsPduHeader and generationDeltaTime) have a byte-aligned UPER layout. The other attributes are model-declared; several overlap."
    packets:
      - "header"
  - name: "cotp"
    kind: "example"
    origin: "plugins/cotp_plugin"
    model: "models/cotp/model.pdl"
    encoding: "network"
    valid: true
    java: "compiles"
    spec: "RFC 905 (ISO 8073 transport protocol) section 13; RFC 1006 section 6 (class 0 over TPKT)"
    packets:
      - "dt-s7"
      - "cr"
  - name: "cpm"
    kind: "example"
    origin: "plugins/cpm_plugin"
    model: "models/cpm/model.pdl"
    encoding: "network"
    valid: true
    java: "compile-fail"
    spec: "ETSI TS 103 324 V2.1.1 (CPM-PDU-Descriptions), ETSI TS 102 894-2 V2.1.1 (ItsPduHeader, MessageId cpm(14)), ITU-T X.691 (UPER)"
    notes: "plugins/cpm_plugin_src classifies on payload bytes 01 32, which is not an ETSI messageId; the fixture follows ETSI."
    packets:
      - "header"
  - name: "dns"
    kind: "example"
    origin: "plugins/dns_plugin"
    model: "models/dns/model.pdl"
    encoding: "network"
    valid: true
    java: "compile-fail"
    spec: "RFC 1035 sections 4.1.1-4.1.4; RFC 6895 section 2 (Z, AD, CD bits)"
    notes: "Inventory bug 2: the Java tool puts qdcount at 6; RFC 1035 puts QDCOUNT at byte 4."
    packets:
      - "query-a"
      - "response-a"
      - "nxdomain-ad-cd"
  - name: "ethernet"
    kind: "example"
    origin: "plugins/ethernet_plugin"
    model: "models/ethernet/model.pdl"
    encoding: "network"
    valid: false
    invalid_reason: "sizeof (mac_addr_t) is not a PDL type: the src and dst attributes do not parse (inventory section 4: Java recovers and emits sizeof(null))"
    java: "syntax-errors"
    spec: "IEEE 802.3 clause 3.1.1 (MAC frame); RFC 894 (IPv4, 0x0800); RFC 2464 (IPv6, 0x86DD); IANA IEEE 802 Numbers registry (ARP 0x0806, RARP 0x8035, LLDP 0x88CC)"
    notes: "PROTO_IP = 15, PROTO_ARP = 11 and PROTO_IP6 = 16 are the model's own defines, not mmt-dpi ids. The struct ethhdr fields and the classifynext switch are valid and keep their expected values."
    packets:
      - "ipv4"
      - "arp"
      - "ipv6"
      - "rarp"
      - "lldp"
  - name: "ip"
    kind: "example"
    origin: "plugins/ip_plugin"
    model: "models/ip/model.pdl"
    encoding: "network"
    valid: true
    java: "no-output"
    spec: "RFC 791 section 3.1 (Internet Header Format); RFC 2474 (DS field)"
    notes: "Valid once keywords are contextual (T1.2): the Java grammar rejects the field name id. The first bitfield line copies Linux's little-endian struct iphdr order (ihl first), so under the corpus MSB-first rule ihl reads the RFC 791 Version nibble and version reads IHL. The flags line follows RFC 791 order."
    packets:
      - "udp-df"
      - "fragment-mf"
  - name: "mongodb"
    kind: "example"
    origin: "plugins/mongodb_plugin"
    model: "models/mongodb/model.pdl"
    encoding: "network"
    valid: false
    invalid_reason: "offset = \"POSITION_NOT_KNOWN\" is not a PDL expression, so no attribute has a position (inventory section 4)"
    java: "syntax-errors"
    spec: "MongoDB Wire Protocol, Standard Message Header and OP_MSG (https://www.mongodb.com/docs/manual/reference/mongodb-wire-protocol/); BSON 1.1 (https://bsonspec.org/spec.html)"
    notes: "The wire protocol is little-endian; the model declares encoding network. Each attribute gives its spec position and value under spec."
    packets:
      - "op-msg-ping"
  - name: "ndn"
    kind: "example"
    origin: "plugins/ndn_plugin"
    model: "models/ndn/model.pdl"
    encoding: "network"
    valid: true
    java: "compile-fail"
    spec: "NDN Packet Format Specification 0.3 (https://docs.named-data.net/NDN-packet-spec/0.3/): Interest (TLV-TYPE 5), Data (6), Name (7), GenericNameComponent (8), Nonce (10), Content (21), SignatureInfo (22), SignatureValue (23), SignatureType (27)"
    packets:
      - "interest"
      - "data"
  - name: "quic"
    kind: "example"
    origin: "plugins/quic_plugin"
    model: "models/quic/model.pdl"
    encoding: "network"
    valid: true
    java: "compile-fail"
    spec: "RFC 9000 section 17.2 and 17.2.2 (long header, Initial packet); no QUIC version matches the model's layout"
    notes: "Both attributes read bytes 0-3. In RFC 9000 those bytes are the first header byte and three bytes of the Version field; in Google QUIC they are the public flags and the start of the connection ID. The values are model-declared."
    packets:
      - "initial-prefix"
  - name: "radius"
    kind: "example"
    origin: "plugins/radius_plugin"
    model: "models/radius/model.pdl"
    encoding: "network"
    valid: true
    java: "compile-fail"
    spec: "RFC 2865 sections 3, 5 and 7.1"
    notes: "Every attribute after authenticator has no offset or data_len: RADIUS attributes are TLVs, so their extraction is a user hook. The fixtures give the RFC 2865 value of each one present in the packet under spec."
    packets:
      - "access-request"
      - "access-accept"
  - name: "s7com"
    kind: "example"
    origin: "plugins/s7com_plugin"
    model: "models/s7com/model.pdl"
    encoding: "network"
    valid: true
    java: "compiles"
    spec: "no public Siemens specification; de-facto layout from the Wireshark S7comm dissector (epan/dissectors/packet-s7comm.c): protocol id, ROSCTR, redundancy identification, PDU reference, parameter length, data length"
    packets:
      - "setup-communication"
      - "setup-communication-ack"
  - name: "tcp"
    kind: "example"
    origin: "plugins/tcp_plugin"
    model: "models/tcp/model.pdl"
    encoding: "network"
    valid: true
    java: "compile-fail"
    spec: "RFC 9293 section 3.1 (Header Format)"
    notes: "Only source and dest match RFC 9293. The model's struct (fields a to h, then seq at byte 12) is 28 bytes and does not follow the TCP header, so the other values are model-declared readings of a real TCP header. Inventory bug 2: Java puts seq at 14; the declared layout puts it at 12."
    packets:
      - "syn-ack-options"
  - name: "topo_ind_sch"
    kind: "example"
    origin: "plugins/topo_ind_sch_plugin"
    model: "models/topo_ind_sch/model.pdl"
    encoding: "network"
    valid: true
    java: "compile-fail"
    spec: "none public: model-declared layout (MSG_TOPO_IND_SCH)"
    notes: "LP_STATIONS_NB and BLOC3 depend on val(); inventory bug 5 folds 7 + val(lc_channels_nb) * 3 to 7 and bug 11 reads val(LP_STATIONS_NB) at position -2."
    packets:
      - "two-channels-one-station"
      - "empty"
  - name: "tpkt"
    kind: "example"
    origin: "plugins/tpkt_plugin"
    model: "models/tpkt/model.pdl"
    encoding: "network"
    valid: true
    java: "compiles"
