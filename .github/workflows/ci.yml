name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # tests/fetch_mmt_dpi_package.sh pins the sha256 of this tag's SHA256SUMS;
  # another tag also needs MMT_DPI_SHA256SUMS_SHA256.
  MMT_DPI_TAG: v1.10.2

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      # Pinned so CI and local runs use the same ShellCheck (the runner image
      # ships an older one). The sha256 is the release asset's GitHub digest.
      SHELLCHECK_VERSION: v0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned ShellCheck
        run: |
          [ "$(uname -m)" = x86_64 ] || { echo "runner arch is $(uname -m), expected x86_64"; exit 1; }
          tarball="shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
          dir="$RUNNER_TEMP/shellcheck"
          mkdir -p "$dir"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$dir/$tarball" \
            "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/$tarball"
          echo "$SHELLCHECK_SHA256  $dir/$tarball" | sha256sum -c -
          tar -xJf "$dir/$tarball" -C "$dir" --strip-components=1 "shellcheck-$SHELLCHECK_VERSION/shellcheck"
          echo "$dir" >> "$GITHUB_PATH"
      - name: Shellcheck the repo's shell scripts
        run: |
          [ "$(command -v shellcheck)" = "$RUNNER_TEMP/shellcheck/shellcheck" ] \
            || { echo "shellcheck resolves to $(command -v shellcheck), not the pinned one"; exit 1; }
          shellcheck --version
          shellcheck --version | grep -qx "version: ${SHELLCHECK_VERSION#v}" \
            || { echo "shellcheck is not $SHELLCHECK_VERSION"; exit 1; }
          mapfile -d '' scripts < <(git ls-files -z -- '*.sh' '*.bash')
          [ "${#scripts[@]}" -gt 0 ] || { echo "no shell scripts found"; exit 1; }
          printf '%s\n' "${scripts[@]}"
          shellcheck "${scripts[@]}"

  corpus:
    name: Test corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the test corpus
        # Stdlib only: the runner's python3 is enough.
        run: |
          python3 --version
          python3 tests/corpus/validate.py

  legacy-reference:
    name: Legacy generator reference output
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Eclipse Temurin 8 JRE, the same 8u502 the reference was written with.
      # The sha256 is the one in the release's .sha256.txt file (it matches
      # the release asset's GitHub digest).
      TEMURIN_TAG: jdk8u502-b07
      TEMURIN_JRE: OpenJDK8U-jre_x64_linux_hotspot_8u502b07.tar.gz
      TEMURIN_JRE_SHA256: f1a7bea0804bfa5627dac412fe7a0d751c4228592e356d6a32a30da54a48ed7a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Java 8 JRE
        run: |
          [ "$(uname -m)" = x86_64 ] || { echo "runner arch is $(uname -m), expected x86_64"; exit 1; }
          dir="$RUNNER_TEMP/jre"
          mkdir -p "$dir"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/$TEMURIN_JRE" \
            "https://github.com/adoptium/temurin8-binaries/releases/download/$TEMURIN_TAG/$TEMURIN_JRE"
          echo "$TEMURIN_JRE_SHA256  $RUNNER_TEMP/$TEMURIN_JRE" | sha256sum -c -
          # A JRE is a tree (bin/java needs lib/), so the whole archive is unpacked.
          tar -xzf "$RUNNER_TEMP/$TEMURIN_JRE" -C "$dir" --strip-components=1
          "$dir/bin/java" -version
          "$dir/bin/java" -version 2>&1 | grep -q '^openjdk version "1.8.0_502"$' \
            || { echo "the JRE is not 1.8.0_502"; exit 1; }
          # The script runs $JAVA, not whichever java is on the runner's PATH.
          echo "JAVA=$dir/bin/java" >> "$GITHUB_ENV"
      - name: Regenerate and diff against legacy/reference-output/
        run: bash legacy/check-reference-output.sh

  ndn-check:
    name: NDN example (ubuntu-24.04, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download and verify the mmt-dpi package
        env:
          MMT_DPI_DISTRO: ubuntu-24.04
          MMT_DPI_ARCH: ${{ matrix.arch }}
        run: |
          [ "$(dpkg --print-architecture)" = "$MMT_DPI_ARCH" ] \
            || { echo "runner arch is $(dpkg --print-architecture), expected $MMT_DPI_ARCH"; exit 1; }
          pkg="$(bash tests/fetch_mmt_dpi_package.sh "$RUNNER_TEMP/mmt-dpi")"
          echo "MMT_DPI_PKG=$pkg" >> "$GITHUB_ENV"
      - name: Install mmt-dpi
        run: |
          sudo apt-get install -y --no-install-recommends "$MMT_DPI_PKG"
          dpkg-query -W -f='${Package} ${Version} ${Architecture}\n' mmt-dpi
          # The package uses the /opt/mmt layout that check_ndn_plugin.sh expects.
          dpkg -L mmt-dpi | grep -qx /opt/mmt/dpi/include/mmt_log.h
          dpkg -L mmt-dpi | grep -qx /opt/mmt/plugins/libmmt_tcpip.so
          # The FHS pkg-config entry (/usr/share/pkgconfig/mmt-dpi.pc) resolves.
          command -v pkg-config > /dev/null \
            || { sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config; }
          pkg-config --exists mmt-dpi || { echo "pkg-config cannot find mmt-dpi"; exit 1; }
          echo "pkg-config mmt-dpi $(pkg-config --modversion mmt-dpi)"
      - name: Build and load the NDN example plugin
        run: MMT_BASE=/opt/mmt bash tests/check_ndn_plugin.sh
