    covered_by:
      - "dns/nxdomain-ad-cd"
      - "dns/query-a"
      - "dns/response-a"
      - "ip/fragment-mf"
      - "ip/udp-df"
      - "pdl_bitfields/runs"
      - "tcp/syn-ack-options"
      - "topo_ind_sch/empty"
      - "topo_ind_sch/two-channels-one-station"
  - id: "struct.type.int"
