# Packet test of examples/ocpp, written from the OCPP-J 1.6 and OCPP 1.6
# specifications (not a port: the corpus has no OCPP model). Format and
# rules: tests/corpus/README.md
schema: 1
id: "ocpp/not-ocpp-type-5"
model: "ocpp"
summary: "A text frame whose array starts with 5: not an OCPP-J message"
parent:
  kind: "stack"
  path:
    - "ethernet"
    - "ip"
    - "tcp"
  selector: "TCP, a WebSocket session whose opening handshake offers ocpp1.6 (any port)"
  source: "OCPP-J 1.6 section 3 (OCPP over WebSocket, subprotocol ocpp1.6) and RFC 6455 section 1.7 (over TCP)"
bytes:
  - "81 24 5b 35 2c 22 31 39 32 32 33 32 31 31 22 2c"
  - "22 42 6f 6f 74 4e 6f 74 69 66 69 63 61 74 69 6f"
  - "6e 22 2c 7b 7d 5d"
bytes_source: "OCPP-J 1.6 section 4.1.3 (the message types 2, 3, 4) and 4.2.1 (the CALL syntax) with an undefined type 5, in one unmasked text frame (RFC 6455 section 5.2)"
expect:
  protocol: "OCPP_EXAMPLE"
  proto_id: 993
  next:
    kind: "none"
    source: "model-declared: encapsulation is false, so no next protocol"
  attributes:
    - name: "message_type_id"
      type: "MMT_U8_DATA"
      status: "absent"
      source: "OCPP-J 1.6 section 4.1.3: MessageTypeId is 2, 3 or 4; 5 is not an OCPP-J message, so nothing is reported"
    - name: "unique_id"
      type: "MMT_STRING_DATA"
      status: "absent"
      source: "OCPP-J 1.6 section 4.1.3: MessageTypeId is 2, 3 or 4; 5 is not an OCPP-J message, so nothing is reported"
    - name: "action"
      type: "MMT_STRING_DATA"
      status: "absent"
      source: "OCPP-J 1.6 section 4.1.3: MessageTypeId is 2, 3 or 4; 5 is not an OCPP-J message, so nothing is reported"
    - name: "payload"
      type: "MMT_BINARY_VAR_DATA"
      status: "absent"
      source: "OCPP-J 1.6 section 4.1.3: MessageTypeId is 2, 3 or 4; 5 is not an OCPP-J message, so nothing is reported"
    - name: "message_count"
      type: "MMT_U32_DATA"
      status: "absent"
      source: "OCPP-J 1.6 section 4.1.3: MessageTypeId is 2, 3 or 4; 5 is not an OCPP-J message, so nothing is reported"
