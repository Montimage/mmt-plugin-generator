# Session test of examples/websocket, written from RFC 6455 (not a port:
# the corpus has no WebSocket model): its packets run in order, one TCP
# connection. Format and rules: tests/corpus/README.md, Session files
schema: 1
id: "websocket/session-from-answer"
model: "websocket"
summary: "A capture that starts at the server's 101 answer, with a frame after it in the segment"
source: "RFC 6455 section 1.2, 4 (the opening handshake) and 5 (framing); the WebSocket layer's session state, examples/README.md, WebSocket"
session:
  through: "tcp:dport=8080,sport=49155"
  protocol: "WEBSOCKET_EXAMPLE"
  proto_id: 992
  attributes:
    - name: "accept"
      type: "MMT_STRING_DATA"
    - name: "carried_len"
      type: "MMT_U32_DATA"
    - name: "close_code"
      type: "MMT_U16_DATA"
    - name: "fin"
      type: "MMT_U8_DATA"
    - name: "frame_count"
      type: "MMT_U32_DATA"
    - name: "handshake"
      type: "MMT_U8_DATA"
    - name: "key"
      type: "MMT_STRING_DATA"
    - name: "mask"
      type: "MMT_U8_DATA"
    - name: "masking_key"
      type: "MMT_U32_DATA"
    - name: "message_opcode"
      type: "MMT_U8_DATA"
    - name: "opcode"
      type: "MMT_U8_DATA"
    - name: "payload"
      type: "MMT_BINARY_VAR_DATA"
    - name: "payload_len"
      type: "MMT_U64_DATA"
    - name: "payload_offset"
      type: "MMT_U32_DATA"
    - name: "rsv1"
      type: "MMT_U8_DATA"
    - name: "rsv2"
      type: "MMT_U8_DATA"
    - name: "rsv3"
      type: "MMT_U8_DATA"
    - name: "status_code"
      type: "MMT_U16_DATA"
    - name: "subprotocol"
      type: "MMT_STRING_DATA"
