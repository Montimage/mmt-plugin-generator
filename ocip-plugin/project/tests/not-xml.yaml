# Packet test of the ocip plugin (mmt-security rule 231), written from the OCI-P wire format,
# not from the plugin's output. Format and rules: tests/corpus/README.md
schema: 1
id: "ocip/not-xml"
model: "ocip"
summary: "Text that is not XML on port 2208: has_dtd 0, nothing else"
through: "tcp:dport=2208"
parent:
  kind: "stack"
  path:
    - "ethernet"
    - "ip"
    - "tcp"
  selector: "TCP port 2208 (OCI-P, cleartext)"
  source: "OCI-P wire format: lukebeer/broadworks-ocip Builder.php (XML_HEAD + BroadsoftDocument, sessionId, command xsi:type) and TCPTransport.php (one document per message, newline-terminated, TCP 2208)"
bytes:
  - "47 45 54 20 2f 20 48 54 54 50 2f 31 2e 31 0d 0a"
  - "48 6f 73 74 3a 20 78 73 70 2e 65 78 61 6d 70 6c"
  - "65 2e 6e 65 74 0d 0a 0d 0a"
bytes_source: "an HTTP request line sent to the OCI-P port"
expect:
  protocol: "OCIP"
  proto_id: 960
  next:
    kind: "none"
    source: "model-declared: encapsulation is false, so no next protocol"
  attributes:
    - name: "has_dtd"
      type: "MMT_U8_DATA"
      offset: 0
      length: 41
      value: 0
      source: "no <!DOCTYPE"
    - name: "dtd"
      type: "MMT_STRING_DATA"
      status: "absent"
      source: "no declaration"
    - name: "session_id"
      type: "MMT_STRING_DATA"
      status: "absent"
      source: "no <sessionId>"
    - name: "command_type"
      type: "MMT_STRING_DATA"
      status: "absent"
      source: "no <command>"
